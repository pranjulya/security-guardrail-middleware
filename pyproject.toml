[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX `license = "MIT"` needs >=77
build-backend = "setuptools.build_meta"

[project]
name = "security-guardrail-middleware"
version = "0.0.0"
description = "Small auditable Python guardrail pipeline (planning: phase 00 baseline)"
readme = "Implementation.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "presidio-analyzer==2.2.360",
    "presidio-anonymizer==2.2.360",
    "spacy==3.8.16",
    # spaCy models are not published on PyPI: pin the official release wheel by
    # URL + sha256 so `pip install .` / `uv pip install .` work in one step.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl#sha256=293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
