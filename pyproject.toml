[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "security-guardrail-middleware"
version = "0.0.0"
description = "Small auditable Python guardrail pipeline (planning: phase 00 baseline)"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "presidio-analyzer==2.2.360",
    "presidio-anonymizer==2.2.360",
    "spacy==3.8.16",
    # en_core_web_lg is not on PyPI — install with: python -m spacy download en_core_web_lg
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
