[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "security-guardrail-middleware"
version = "0.0.0"
description = "Small auditable Python guardrail pipeline (planning: phase 00 baseline)"
readme = "Implementation.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "presidio-analyzer==2.2.360",
    "presidio-anonymizer==2.2.360",
    "spacy==3.8.16",
    "en-core-web-lg==3.8.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
